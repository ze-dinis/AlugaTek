services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alugatek
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=alugatek;Username=postgres;Password=postgres

      - Jwt__Key=LUZhjIirzwXAzPIBiSNNoZ5ptrwj/U530Kqc/476cGM=
      - Jwt__Issuer=alugatek-api
      - Jwt__Audience=alugatek-app
      - EmailVerification__Enabled=${EMAIL_VERIFICATION_ENABLED:-true}
      - EmailVerification__VerificationEndpoint=${EMAIL_VERIFICATION_ENDPOINT:-http://localhost:5000/api/auth/verify-email}
      - EmailVerification__TokenTtlMinutes=${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:-10}
      - EmailVerification__FromEmail=${EMAIL_VERIFICATION_FROM_EMAIL:-no-reply@alugatek.pt}
      - EmailVerification__FromName=${EMAIL_VERIFICATION_FROM_NAME:-Alugatek}
      - EmailVerification__ResendApiKey=${EMAIL_VERIFICATION_RESEND_API_KEY:-}
      - EmailVerification__SmtpHost=${EMAIL_VERIFICATION_SMTP_HOST:-smtp.zoho.eu}
      - EmailVerification__SmtpPort=${EMAIL_VERIFICATION_SMTP_PORT:-587}
      - EmailVerification__UseSsl=${EMAIL_VERIFICATION_USE_SSL:-true}
      - EmailVerification__SmtpUsername=${EMAIL_VERIFICATION_SMTP_USERNAME:-no-reply@alugatek.pt}
      - EmailVerification__SmtpPassword=${EMAIL_VERIFICATION_SMTP_PASSWORD:-}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      - postgres
    volumes:
      - uploads:/app/wwwroot/uploads

  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    ports:
      - "8088:80"

volumes:
  pgdata:
  uploads:
