services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alugatek
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=alugatek;Username=postgres;Password=postgres

      - Jwt__Key=be492a412972bbcecf64d3e7bb7a7424
      - Jwt__Issuer=alugatek-api
      - Jwt__Audience=alugatek-app
    depends_on:
      - postgres

volumes:
  pgdata:
